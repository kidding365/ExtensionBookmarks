<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExtensionBookmarks</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo-area">
        <img src="../../../icons/icon32.png" alt="Logo" class="logo-icon">
        <span class="app-title">ExtensionBookmarks</span>
      </div>
      <div id="syncStatusBadge" class="sync-badge idle" title="Sync Status">
        <span class="sync-dot"></span>
        <span id="syncStatusText">Synced</span>
      </div>
    </header>

    <div class="folder-selector-area">
      <label for="targetFolderSelect" class="field-label">Save into Group Folder:</label>
      <select id="targetFolderSelect" class="folder-select">
        <option value="">(No Folder / Default)</option>
      </select>
    </div>

    <div class="actions-area">
      <button id="btnStashWindow" class="btn btn-primary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
        <span id="btnStashWindowText">Stash Window Tabs</span>
      </button>

      <button id="btnStashTab" class="btn btn-secondary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Stash Active Tab</span>
      </button>
    </div>

    <div class="quick-search-area">
      <div class="search-input-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="quickSearchInput" placeholder="Search tabs & bookmarks..." autocomplete="off">
      </div>
      <div id="quickSearchResults" class="search-results-list hidden"></div>
    </div>

    <footer class="popup-footer">
      <button id="btnOpenDashboard" class="link-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="footer-icon">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Open Dashboard</span>
      </button>

      <button id="btnQuickSync" class="icon-btn" title="Sync Now with GitHub Gist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="footer-icon">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
